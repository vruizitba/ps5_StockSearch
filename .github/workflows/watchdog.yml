# Vigilante externo del monitor de stock.
#
# El Worker se avisa solo cuando una tienda se rompe o cuando el reloj se para,
# pero no puede avisar que dejo de correr: si no corre, no hay nadie adentro para
# mandar el mail. Este workflow corre en la infraestructura de GitHub, fuera de
# Cloudflare, y le pregunta a /health desde afuera.
#
# /health devuelve 503 si hace mas de 5 minutos que no se chequea ninguna tienda,
# si el ultimo correo fallo, o si todas las tiendas estan ciegas.
name: watchdog

on:
  schedule:
    # Cada hora, medido y no elegido a gusto.
    #
    # '*/5' no disparo NI UNA VEZ en 46 minutos. '*/15' dio 2 corridas en 10
    # horas, cuando tocaban 40. En los dos casos el workflow estaba en estado
    # 'active' y los disparos manuales funcionaban. GitHub desprioriza los cron
    # frecuentes y descarta corridas bajo carga; los horarios los respeta mucho
    # mejor.
    #
    # No cuesta cobertura: UptimeRobot consulta la misma URL cada 5 minutos y es
    # la primera linea. Este es el respaldo por si UptimeRobot mismo falla, y un
    # respaldo que corre de verdad cada hora vale mas que uno que promete cada
    # 15 minutos y corre cada cinco horas.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      health_url:
        description: >-
          URL a consultar. Dejala vacia para el monitor real. Poniendo una URL
          muerta se ensaya el camino de la alarma: es la unica forma de saber
          que el aviso funciona sin esperar a que el Worker se caiga de verdad.
        required: false
        default: ''

permissions:
  actions: read
  contents: read

env:
  HEALTH_URL: ${{ inputs.health_url || 'https://ps5-stock-monitor.valenruiz2004-c85.workers.dev/health' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Preguntarle a /health
        id: probe
        run: |
          # Dos intentos separados por 30 s. Un solo fallo puede ser un hipo de
          # red de GitHub; dos seguidos ya es la app.
          for intento in 1 2; do
            code=$(curl -sS -m 20 -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "Sano (HTTP 200)"; cat /tmp/health.json; exit 0
            fi
            echo "Intento $intento: HTTP $code"
            [ "$intento" = 1 ] && sleep 30
          done

          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<FIN'
            head -c 600 /tmp/health.json 2>/dev/null || echo '(sin cuerpo)'
            echo
            echo FIN
          } >> "$GITHUB_OUTPUT"

      # Si la corrida anterior ya habia fallado, el aviso ya se mando. Un
      # vigilante que manda 12 mails por hora se termina silenciando, y un
      # vigilante silenciado no vigila.
      - name: ¿Ya avisamos?
        id: dedup
        if: steps.probe.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo explicito: el job no hace checkout, asi que gh no tiene
          # contexto de repositorio y sin esto la consulta falla en silencio
          # y el dedup nunca deduplica.
          previa=$(gh run list --repo "${{ github.repository }}" \
                     --workflow watchdog.yml --branch main \
                     --status completed --limit 1 --json conclusion \
                     --jq '.[0].conclusion // "none"' 2>&1 || echo none)
          echo "Conclusion de la corrida anterior: $previa"
          if [ "$previa" = "failure" ]; then
            echo "avisar=false" >> "$GITHUB_OUTPUT"
          else
            echo "avisar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar
        if: steps.probe.outputs.ok == 'false' && steps.dedup.outputs.avisar == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAILS: ${{ vars.ALERT_EMAILS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CODE: ${{ steps.probe.outputs.code }}
          BODY: ${{ steps.probe.outputs.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Se manda desde GitHub, no desde el Worker: el Worker es justamente lo
          # que puede estar caido. Y por los dos canales, para que el aviso de
          # "se cayo el monitor" no dependa del mismo proveedor unico.
          python3 - <<'PY'
          import json, os, urllib.request

          html = (
              '<div style="font-family:system-ui,sans-serif;max-width:520px">'
              '<h2>El monitor de PS5 no responde</h2>'
              f'<p>HTTP <strong>{os.environ["CODE"]}</strong> en dos intentos '
              'separados por 30 segundos.</p>'
              f'<pre style="background:#f4f4f5;padding:10px;border-radius:6px;'
              f'font-size:12px;overflow:auto">{os.environ.get("BODY","")[:600]}</pre>'
              '<p style="color:#666;font-size:14px">Mientras dure, no vas a '
              'recibir alertas de stock de ninguna tienda.</p>'
              f'<p style="font-size:13px"><a href="{os.environ["RUN_URL"]}">'
              'Ver la corrida en GitHub</a></p></div>'
          )
          # Sin User-Agent propio, Resend contesta 403: rechaza el
          # 'Python-urllib/3.x' que manda urllib por defecto. Con la misma key,
          # curl pasa. Lo encontro el ensayo de la alarma.
          UA = "ps5-stock-monitor-watchdog/1.0"
          entregados = 0

          def post(url, payload, headers, etiqueta):
              global entregados
              req = urllib.request.Request(
                  url, data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json", "User-Agent": UA, **headers},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print(etiqueta, "->", r.status)
                      entregados += 1
              except Exception as e:
                  # Anotacion de error: que se vea en la corrida, no solo en el log.
                  print(f"::error::no se pudo avisar a {etiqueta}: {e}")

          key = os.environ.get("RESEND_API_KEY", "")
          for to in [a.strip() for a in os.environ.get("ALERT_EMAILS", "").split(",") if a.strip()]:
              if not key:
                  break
              post("https://api.resend.com/emails",
                   {"from": "onboarding@resend.dev", "to": [to],
                    "subject": "Monitor PS5: el worker no responde", "html": html},
                   {"Authorization": f"Bearer {key}"}, to)

          tg = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          for chat in [c.strip() for c in os.environ.get("TELEGRAM_CHAT_ID", "").split(",") if c.strip()]:
              if not tg:
                  break
              post(f"https://api.telegram.org/bot{tg}/sendMessage",
                   {"chat_id": chat, "parse_mode": "HTML", "disable_web_page_preview": True,
                    "text": ("🚨 <b>El monitor de PS5 no responde</b>\n\n"
                             f'HTTP {os.environ["CODE"]} en dos intentos.\n'
                             "Mientras dure, no hay alertas de stock de ninguna tienda.\n\n"
                             f'<a href="{os.environ["RUN_URL"]}">Ver la corrida</a>')},
                   {}, f"telegram:{chat}")

          if entregados == 0:
              print("::error::ningun canal pudo entregar el aviso")
          PY

      # Falla el job a proposito: dispara ademas el mail propio de GitHub por
      # workflow fallido, que es el respaldo si el paso de Resend tambien falla.
      - name: Marcar la corrida como fallida
        if: steps.probe.outputs.ok == 'false'
        run: |
          echo "::error::/health devolvio ${{ steps.probe.outputs.code }}"
          exit 1
